name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: TypeScript check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Run backend API tests
        run: npm run test:api

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/ml/requirements.txt

      - name: Install Python deps
        run: pip install -r backend/ml/requirements.txt

      - name: Run ML pipeline
        run: cd backend/ml && python3 pipeline.py

      - name: Run ML schema tests
        run: npm run test:ml
